<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clientes</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}

:root{
    --azul:#0b7cff;
    --verde:#16a34a;
    --rojo:#ef4444;
    --fondo:#f3f6fb;
    --texto:#0f172a;
    --gris:#64748b;
    --linea:#e5e7eb;
}

body{
    background:var(--fondo);
    color:var(--texto);
    overflow:hidden;
}

.header{
    position:fixed;
    top:0;
    left:0;
    right:0;
    height:75px;
    background:white;
    border-bottom:1px solid var(--linea);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 25px;
    z-index:1000;
}

.header-left{
    display:flex;
    align-items:center;
    gap:18px;
}

.header-left i{
    font-size:25px;
}

.header h1{
    font-size:28px;
}

.btn-header{
    height:48px;
    border:none;
    border-radius:12px;
    background:var(--azul);
    color:white;
    padding:0 20px;
    font-weight:bold;
    font-size:16px;
    cursor:pointer;
}

.sidebar{
    position:fixed;
    top:75px;
    left:0;
    bottom:0;
    width:230px;
    background:white;
    border-right:1px solid var(--linea);
    padding:22px 12px;
    z-index:900;
}

.menu-item{
    display:flex;
    align-items:center;
    gap:13px;
    padding:14px 15px;
    border-radius:12px;
    margin-bottom:8px;
    font-size:14px;
    font-weight:700;
    color:#334155;
    cursor:pointer;
    transition:.2s;
}

.menu-item:hover{
    background:#eef5ff;
    color:var(--azul);
}

.menu-item i{
    font-size:18px;
    width:22px;
}

.menu-item.active{
    background:var(--azul);
    color:white;
    box-shadow:0 8px 16px rgba(11,124,255,.22);
}

.config-separator{
    margin-top:35px;
    border-top:1px solid var(--linea);
    padding-top:15px;
}

.content{
    position:fixed;
    top:75px;
    left:230px;
    right:0;
    bottom:0;
    overflow-y:auto;
    padding:25px;
}

.card{
    background:white;
    border-radius:24px;
    padding:28px;
    box-shadow:0 8px 25px rgba(0,0,0,.06);
}

.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
    gap:15px;
}

.top h2{
    font-size:34px;
}

.search-box{
    height:56px;
    width:420px;
    border:1px solid var(--linea);
    border-radius:14px;
    display:flex;
    align-items:center;
    gap:12px;
    padding:0 18px;
}

.search-box input{
    width:100%;
    height:100%;
    border:none;
    outline:none;
    font-size:17px;
}

.search-box i{
    color:var(--gris);
    font-size:20px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
    margin-bottom:28px;
}

.stat{
    border:1px solid var(--linea);
    border-radius:18px;
    padding:22px;
    background:white;
}

.stat h3{
    font-size:16px;
    color:#334155;
    margin-bottom:14px;
}

.stat b{
    font-size:30px;
    color:var(--azul);
}

.stat.green b{
    color:var(--verde);
}

.table{
    width:100%;
}

.header-row,
.cliente-row{
    display:grid;
    grid-template-columns:1.2fr 1fr 1.3fr 1.2fr 1.2fr;
    gap:15px;
    align-items:center;
}

.header-row{
    padding:18px 0;
    border-bottom:1px solid var(--linea);
    font-size:16px;
    font-weight:bold;
}

.cliente-row{
    min-height:76px;
    border-bottom:1px solid #f1f5f9;
    font-size:15px;
    font-weight:bold;
    color:#475569;
}

.actions{
    display:flex;
    gap:18px;
}

.actions i{
    cursor:pointer;
    font-size:22px;
}

.edit{
    color:#334155;
}

.delete{
    color:var(--rojo);
}

.whatsapp{
    color:#16a34a;
}

.empty{
    padding:30px;
    text-align:center;
    font-size:18px;
    font-weight:bold;
    color:#64748b;
}

.modal{
    position:fixed;
    inset:0;
    background:rgba(15,23,42,.55);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:3000;
    padding:15px;
}

.modal.active{
    display:flex;
}

.modal-box{
    background:white;
    width:95%;
    max-width:560px;
    max-height:90vh;
    overflow-y:auto;
    border-radius:24px;
    padding:28px;
    box-shadow:0 20px 60px rgba(0,0,0,.25);
}

.modal-box h2{
    font-size:28px;
    margin-bottom:22px;
}

.modal-box input,
.modal-box textarea{
    width:100%;
    border:1px solid #dbe2ea;
    border-radius:14px;
    padding:0 15px;
    font-size:17px;
    margin-bottom:14px;
    outline:none;
}

.modal-box input{
    height:55px;
}

.modal-box textarea{
    height:95px;
    padding-top:14px;
    resize:none;
}

.modal-actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    margin-top:18px;
}

.modal-actions button{
    height:55px;
    border:none;
    border-radius:14px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.save{
    background:var(--azul);
    color:white;
}

.cancel{
    background:#f1f5f9;
    color:#0f172a;
}

@media(max-width:1000px){
    .sidebar{
        width:82px;
    }

    .menu-item{
        justify-content:center;
        padding:16px 8px;
    }

    .menu-item span{
        display:none;
    }

    .content{
        left:82px;
    }

    .stats{
        grid-template-columns:1fr;
    }

    .card{
        overflow-x:auto;
    }

    .top,
    .stats,
    .table{
        min-width:950px;
    }
}

@media(max-width:650px){
    .header{
        height:65px;
        padding:0 12px;
    }

    .header h1{
        font-size:20px;
    }

    .btn-header span{
        display:none;
    }

    .sidebar{
        top:65px;
    }

    .content{
        top:65px;
        padding:14px;
    }

    .top h2{
        font-size:26px;
    }
}
</style>
</head>

<body>

<header class="header">
    <div class="header-left">
        <i class="fa-solid fa-bars"></i>
        <h1>Clientes</h1>
    </div>

    <button class="btn-header" onclick="abrirModal()">
        <i class="fa-solid fa-plus"></i>
        <span>Agregar</span>
    </button>
</header>

<aside class="sidebar">
    <div class="menu-item" onclick="location.href='nueva_venta.html'">
        <i class="fa-solid fa-cart-shopping"></i>
        <span>Nueva venta</span>
    </div>

    <div class="menu-item" onclick="location.href='dashboard.html'">
        <i class="fa-solid fa-chart-line"></i>
        <span>Dashboard</span>
    </div>

    <div class="menu-item" onclick="location.href='productos.html'">
        <i class="fa-solid fa-box"></i>
        <span>Productos</span>
    </div>

    <div class="menu-item" onclick="location.href='inventario.html'">
        <i class="fa-solid fa-warehouse"></i>
        <span>Inventario</span>
    </div>

    <div class="menu-item active" onclick="location.href='clientes.html'">
        <i class="fa-solid fa-users"></i>
        <span>Clientes</span>
    </div>

    <div class="menu-item" onclick="location.href='ventas.html'">
        <i class="fa-solid fa-receipt"></i>
        <span>Ventas</span>
    </div>

    <div class="menu-item" onclick="location.href='cotizaciones.html'">
        <i class="fa-solid fa-file-lines"></i>
        <span>Cotizaciones</span>
    </div>

    <div class="menu-item" onclick="location.href='reportes.html'">
        <i class="fa-solid fa-chart-pie"></i>
        <span>Reportes</span>
    </div>

    <div class="menu-item" onclick="location.href='gastos.html'">
        <i class="fa-solid fa-money-bill-wave"></i>
        <span>Gastos</span>
    </div>

    <div class="menu-item config-separator" onclick="location.href='configuracion.html'">
        <i class="fa-solid fa-gear"></i>
        <span>Configuración</span>
    </div>
</aside>

<main class="content">
    <div class="card">

        <div class="top">
            <h2>Registro de clientes</h2>

            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="buscar" placeholder="Buscar cliente, teléfono o negocio">
            </div>
        </div>

        <div class="stats">
            <div class="stat green">
                <h3>Total clientes</h3>
                <b id="totalClientes">0</b>
            </div>

            <div class="stat">
                <h3>Clientes con negocio</h3>
                <b id="clientesNegocio">0</b>
            </div>

            <div class="stat">
                <h3>Clientes hoy</h3>
                <b id="clientesHoy">0</b>
            </div>
        </div>

        <div class="table">
            <div class="header-row">
                <div>Cliente</div>
                <div>Teléfono</div>
                <div>Negocio</div>
                <div>Dirección</div>
                <div>Acciones</div>
            </div>

            <div id="listaClientes"></div>
        </div>

    </div>
</main>

<div class="modal" id="modalCliente">
    <div class="modal-box">
        <h2 id="tituloModal">Nuevo cliente</h2>

        <input type="text" id="nombre" placeholder="Nombre del cliente">
        <input type="text" id="telefono" placeholder="Teléfono">
        <input type="text" id="negocio" placeholder="Nombre del negocio">
        <input type="text" id="correo" placeholder="Correo electrónico">
        <textarea id="direccion" placeholder="Dirección"></textarea>

        <div class="modal-actions">
            <button class="cancel" onclick="cerrarModal()">Cancelar</button>
            <button class="save" onclick="guardarCliente()">Guardar</button>
        </div>
    </div>
</div>

<script src="supabase-config.js"></script>
<script src="supabase-sync.js"></script>
<script>
let editando = null;

function formatoFecha(){
    const f = new Date();
    return f.toLocaleDateString("es-DO");
}

function leerLS(clave){
    try{
        return JSON.parse(localStorage.getItem(clave)) || [];
    }catch(e){
        return [];
    }
}

function guardarLS(clave, valor){
    localStorage.setItem(clave, JSON.stringify(valor));
}

let clientes = leerLS("clientesPOS");

function alerta(titulo,texto,icono="success"){
    Swal.fire({
        title:titulo,
        text:texto,
        icon:icono,
        confirmButtonColor:"#0b7cff"
    });
}

function abrirModal(){
    editando = null;

    document.getElementById("tituloModal").innerText = "Nuevo cliente";
    document.getElementById("nombre").value = "";
    document.getElementById("telefono").value = "";
    document.getElementById("negocio").value = "";
    document.getElementById("correo").value = "";
    document.getElementById("direccion").value = "";

    document.getElementById("modalCliente").classList.add("active");
}

function cerrarModal(){
    document.getElementById("modalCliente").classList.remove("active");
}

function guardarCliente(){
    const nombre = document.getElementById("nombre").value.trim();
    const telefono = document.getElementById("telefono").value.trim();
    const negocio = document.getElementById("negocio").value.trim();
    const correo = document.getElementById("correo").value.trim();
    const direccion = document.getElementById("direccion").value.trim();

    if(!nombre || !telefono){
        alerta("Campos incompletos","Nombre y teléfono son obligatorios","warning");
        return;
    }

    const telefonoExiste = clientes.some((c,index)=>
        c.telefono === telefono && index !== editando
    );

    if(telefonoExiste){
        alerta("Teléfono repetido","Ya existe un cliente con este teléfono","error");
        return;
    }

    const cliente = {
        id: editando !== null ? clientes[editando].id : Date.now(),
        nombre,
        telefono,
        negocio,
        correo,
        direccion,
        fecha: editando !== null ? clientes[editando].fecha : formatoFecha()
    };

    if(editando === null){
        clientes.unshift(cliente);
        alerta("Guardado","Cliente agregado correctamente");
    }else{
        clientes[editando] = cliente;
        alerta("Actualizado","Cliente actualizado correctamente");
    }

    guardarLS("clientesPOS", clientes);
    cerrarModal();
    mostrarClientes();
}

function editarCliente(index){
    editando = index;
    const c = clientes[index];

    document.getElementById("tituloModal").innerText = "Editar cliente";
    document.getElementById("nombre").value = c.nombre;
    document.getElementById("telefono").value = c.telefono;
    document.getElementById("negocio").value = c.negocio || "";
    document.getElementById("correo").value = c.correo || "";
    document.getElementById("direccion").value = c.direccion || "";

    document.getElementById("modalCliente").classList.add("active");
}

function eliminarCliente(index){
    Swal.fire({
        title:"¿Eliminar cliente?",
        text:"Esta acción no se puede deshacer",
        icon:"warning",
        showCancelButton:true,
        confirmButtonText:"Sí, eliminar",
        cancelButtonText:"Cancelar",
        confirmButtonColor:"#ef4444",
        cancelButtonColor:"#64748b"
    }).then(res=>{
        if(res.isConfirmed){
            clientes.splice(index,1);
            guardarLS("clientesPOS", clientes);
            mostrarClientes();
            alerta("Eliminado","Cliente eliminado correctamente");
        }
    });
}

function abrirWhatsApp(telefono){
    const limpio = telefono.replace(/\D/g,"");
    window.open(`https://wa.me/1${limpio}`,"_blank");
}

function calcularResumen(lista){
    const hoy = formatoFecha();

    document.getElementById("totalClientes").innerText = clientes.length;
    document.getElementById("clientesNegocio").innerText =
        clientes.filter(c => c.negocio && c.negocio.trim() !== "").length;
    document.getElementById("clientesHoy").innerText =
        clientes.filter(c => c.fecha === hoy).length;
}

function mostrarClientes(){
    const texto = document.getElementById("buscar").value.toLowerCase();
    const contenedor = document.getElementById("listaClientes");

    const lista = clientes.filter(c =>
        String(c.nombre || "").toLowerCase().includes(texto) ||
        String(c.telefono || "").toLowerCase().includes(texto) ||
        String(c.negocio || "").toLowerCase().includes(texto) ||
        String(c.direccion || "").toLowerCase().includes(texto)
    );

    contenedor.innerHTML = "";

    calcularResumen(lista);

    if(lista.length === 0){
        contenedor.innerHTML = `
            <div class="empty">
                No hay clientes registrados.
            </div>
        `;
        return;
    }

    lista.forEach(c=>{
        const index = clientes.indexOf(c);

        contenedor.innerHTML += `
            <div class="cliente-row">
                <div>${c.nombre}</div>
                <div>${c.telefono}</div>
                <div>${c.negocio || "-"}</div>
                <div>${c.direccion || "-"}</div>
                <div class="actions">
                    <i class="fa-brands fa-whatsapp whatsapp" onclick="abrirWhatsApp('${c.telefono}')"></i>
                    <i class="fa-solid fa-pen edit" onclick="editarCliente(${index})"></i>
                    <i class="fa-solid fa-trash-can delete" onclick="eliminarCliente(${index})"></i>
                </div>
            </div>
        `;
    });
}

document.getElementById("buscar").addEventListener("input", mostrarClientes);

mostrarClientes();
</script>

</body>
</html>
